[package]
name = "solidcraft-collab"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Multi-user add-on for SolidCraft: admin-approved accounts, teams, projects with version history, per-part edit locks and live presence, around SolidCraft's browser embed API."
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
debug = 0
